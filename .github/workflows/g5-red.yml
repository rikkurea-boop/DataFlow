name: P08 G5 RED

on:
  push:
    branches:
      - validation/p08-g5-red

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --no-cache -r requirements.txt
          uv pip install -e .[test]
      - name: Run G5 boundary regressions
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest -q test/cpu_only/test_pdf2model_step2_cache_boundary.py
