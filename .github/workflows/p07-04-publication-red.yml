name: P07.04 publication RED

on:
  push:
    branches:
      - validation/p07-04-publication-red

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv pip install --system --no-cache -r requirements.txt
          uv pip install --system -e .[test]
      - name: Run publication boundary regression
        run: pytest -q test/cpu_only/test_batched_storage_zero_row_contract.py
