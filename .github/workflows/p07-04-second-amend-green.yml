name: P07.04 second amended publication GREEN

on:
  push:
    branches:
      - validation/p07-04-second-amend-green

permissions:
  contents: read

jobs:
  green:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - name: Use short Windows temp path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\t | Out-Null
          "TEMP=D:\t" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=D:\t" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system --no-cache -r requirements.txt
          uv pip install --system -e ".[test]"
      - name: Targeted P07.04 regression tests
        shell: bash
        run: pytest -q test/cpu_only/test_batched_storage_zero_row_contract.py
      - name: CPU and API suite
        shell: bash
        run: pytest -m "cpu or api"
      - name: Compile changed Python files
        shell: bash
        run: python -m py_compile dataflow/utils/storage.py test/cpu_only/test_batched_storage_zero_row_contract.py
      - name: Publication diff check
        shell: bash
        run: |
          git diff --check 4b2a0b8abbf9988f20f309c1f241c90357914147 322134bd5b5ef2dd62a4aabf9598bb454134183f
          git diff --exit-code 322134bd5b5ef2dd62a4aabf9598bb454134183f HEAD -- dataflow test
