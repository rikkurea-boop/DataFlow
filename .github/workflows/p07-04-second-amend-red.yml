name: P07.04 second amendment RED

on:
  push:
    branches:
      - validation/p07-04-second-amend-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv pip install --system --no-cache -r requirements.txt
          uv pip install --system -e ".[test]"
      - name: Reproduce multi-batch CSV contract
        run: pytest -q test/cpu_only/test_batched_storage_zero_row_contract.py
