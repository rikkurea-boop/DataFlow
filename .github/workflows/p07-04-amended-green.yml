name: P07.04 amended publication GREEN

on:
  push:
    branches:
      - validation/p07-04-amended-green

permissions:
  contents: read

jobs:
  green:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        shell: bash
        run: |
          uv pip install --system --no-cache -r requirements.txt
          uv pip install --system -e ".[test]"
      - name: Targeted zero-row round trip
        shell: bash
        run: pytest -q test/cpu_only/test_batched_storage_zero_row_contract.py -k zero_row_list_round_trips_through_real_batched_operator
      - name: Non-empty list and DataFrame controls
        shell: bash
        run: pytest -q test/cpu_only/test_batched_storage_zero_row_contract.py -k batched_write_preserves_non_empty_list_and_dataframe
      - name: Unsupported-list controls
        shell: bash
        run: pytest -q test/cpu_only/test_batched_storage_zero_row_contract.py -k batched_write_still_rejects_unsupported_list_elements
      - name: CSV error compatibility controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from dataflow.utils.storage import BatchedFileStorage

          with TemporaryDirectory() as tmp:
              root = Path(tmp)
              storage = BatchedFileStorage(
                  first_entry_file_name=str(root / "source.csv"),
                  cache_path=str(root / "cache"),
                  cache_type="csv",
              )

              missing = root / "missing.csv"
              try:
                  storage._load_local_file(str(missing), "csv")
              except FileNotFoundError as exc:
                  assert str(exc) == f"File {missing} does not exist. Please check the path."
              else:
                  raise AssertionError("missing CSV must preserve FileNotFoundError")

              invalid = root / "invalid.csv"
              invalid.write_text('a,b\n1,"unterminated\n', encoding="utf-8")
              try:
                  storage._load_local_file(str(invalid), "csv")
              except ValueError as exc:
                  assert str(exc).startswith("Failed to load csv file:")
              else:
                  raise AssertionError("invalid CSV must preserve wrapped ValueError")
          PY
      - name: CPU and API suite
        shell: bash
        run: pytest -m "cpu or api"
      - name: Compile changed Python files
        shell: bash
        run: python -m py_compile dataflow/utils/storage.py test/cpu_only/test_batched_storage_zero_row_contract.py
      - name: Publication diff check
        shell: bash
        run: |
          git diff --check 4b2a0b8abbf9988f20f309c1f241c90357914147 f76afe6c9629f855aba29f0e9da01377a64e79f0
          git diff --exit-code f76afe6c9629f855aba29f0e9da01377a64e79f0 HEAD -- dataflow test
