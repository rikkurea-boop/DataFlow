name: P04.01 RED validation

on:
  push:
    branches:
      - validation/p04-01-red

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --no-cache -r requirements.txt
          uv pip install -e .[test]
      - name: Run P04.01 regression
        run: pytest -q test/cpu_only/test_batch_wrapper_dummy_storage.py
