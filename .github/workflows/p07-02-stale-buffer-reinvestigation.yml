name: P07.02 stale-buffer reinvestigation

on:
  push:
    branches:
      - validation/p07-02-stale-buffer-reinvestigation

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv pip install --system --no-cache -r requirements.txt
          uv pip install --system -e ".[test]"
      - name: P07.02 supported-state-transition regression
        run: pytest -q test/cpu_only/test_batched_storage_stale_buffer_reinvestigation.py
