name: G2T debug

on:
  push:
    branches:
      - validation/p08-g2t-debug

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --no-cache -r requirements.txt
          uv pip install -e .[test]
      - name: Inspect CliRunner real subprocess boundary
        run: |
          python - <<'PY'
          import json, os, tempfile
          from pathlib import Path
          from typer.testing import CliRunner
          from dataflow.cli import app
          from dataflow.cli_funcs import cli_text

          root = Path(tempfile.mkdtemp(prefix='g2t-debug-'))
          workspace = root / 'workspace'
          input_dir = workspace / 'input'
          cache = root / 'selected-cache'
          input_dir.mkdir(parents=True)
          cache.mkdir()
          (input_dir / 'current.json').write_text(json.dumps({'text':'current selected-cache text'}), encoding='utf-8')
          config = cache / '.cache' / 'train_config.yaml'
          config.parent.mkdir(parents=True)
          config.write_text('model_name_or_path: stub\n', encoding='utf-8')
          os.chdir(workspace)
          os.environ['PWD'] = str(workspace)
          cli_text.verify_environment = lambda: True

          runner = CliRunner()
          result = runner.invoke(app, ['text2model', 'train', str(input_dir), '--cache', str(cache)])
          manifest = cache / '.cache' / 'gpu' / 'text_input.jsonl'
          print('exit_code=', result.exit_code)
          print('exception_type=', None if result.exception is None else type(result.exception).__name__)
          print('exception_repr=', repr(result.exception))
          print('captured_output=', repr(result.output))
          print('manifest_exists=', manifest.exists())
          PY
