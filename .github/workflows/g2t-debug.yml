name: G2T debug

on:
  push:
    branches:
      - validation/p08-g2t-debug

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --no-cache -r requirements.txt
          uv pip install -e .[test]
      - name: Inspect real Step-1 chain
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, tempfile
          from pathlib import Path
          import dataflow
          from dataflow.cli_funcs import cli_text

          root = Path(tempfile.mkdtemp(prefix='g2t-debug-'))
          workspace = root / 'workspace'
          input_dir = workspace / 'input'
          cache = root / 'selected-cache'
          input_dir.mkdir(parents=True)
          cache.mkdir()
          (input_dir / 'current.json').write_text(json.dumps({'text':'current selected-cache text'}), encoding='utf-8')
          config = cache / '.cache' / 'train_config.yaml'
          config.parent.mkdir(parents=True)
          config.write_text('model_name_or_path: stub\n', encoding='utf-8')
          os.chdir(workspace)
          os.environ['PWD'] = str(workspace)

          script = cli_text.get_dataflow_script_path('merge_json_jsonl.py')
          print('dataflow_file=', dataflow.__file__)
          print('lookup=', script)
          print('lookup_exists=', None if script is None else Path(script).exists())
          if script is not None:
              p = subprocess.run([sys.executable, str(script), str(input_dir), '--cache', str(cache)], cwd=str(workspace), text=True, capture_output=True)
              print('direct_rc=', p.returncode)
              print('direct_stdout=', p.stdout)
              print('direct_stderr=', p.stderr)
              manifest = cache / '.cache' / 'gpu' / 'text_input.jsonl'
              print('direct_manifest_exists=', manifest.exists())
              if manifest.exists():
                  print('direct_manifest=', manifest.read_text(encoding='utf-8'))
                  manifest.unlink()

          cli_text.verify_environment = lambda: True
          ok = cli_text.cli_text2model_train(
              lf_yaml=str(config),
              input_dir=str(input_dir),
              cache_path=str(cache),
          )
          manifest = cache / '.cache' / 'gpu' / 'text_input.jsonl'
          print('helper_ok=', ok)
          print('helper_manifest_exists=', manifest.exists())
          if manifest.exists():
              print('helper_manifest=', manifest.read_text(encoding='utf-8'))
          PY
