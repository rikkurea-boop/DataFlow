name: P09.07 GREEN validation

on:
  push:
    branches:
      - validation/p09-07-green-current

jobs:
  test:
    name: P09.07 ${{ matrix.os }} Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f212b4d81b1403e21287d7da07ea308b274fc881
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Free disk on Linux
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --no-cache -r requirements.txt
          uv pip install -e .[test]
      - name: P09.07 contract regression
        run: pytest -q test/cpu_only/test_litellm_mutable_state_contract.py
      - name: Compile changed Python files
        run: python -m py_compile dataflow/serving/lite_llm_serving.py test/cpu_only/test_litellm_mutable_state_contract.py
      - name: Full CPU/API suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -m "cpu or api"
      - name: Candidate diff check
        if: runner.os == 'Linux'
        run: git diff --check 4b2a0b8abbf9988f20f309c1f241c90357914147..f212b4d81b1403e21287d7da07ea308b274fc881
