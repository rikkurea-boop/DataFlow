name: P07.01 transactional resume validation

on:
  push:
    branches:
      - validation/p07-01-pr550-9d8f4bc
  workflow_dispatch:

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        env:
          UV_SYSTEM_PYTHON: "1"
        run: |
          uv pip install --no-cache -r requirements.txt
          uv pip install -e .[test]
      - name: P07.01 focused tests
        run: |
          python -m pytest -q test/cpu_only/test_stream_transactional_resume.py
      - name: CPU/API suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -m "cpu or api"
      - name: P07.01 SHA-256 benchmark
        if: runner.os == 'Linux'
        run: |
          python test/cpu_only/benchmark_stream_transaction_hash.py
      - name: Syntax compile
        run: |
          python -m compileall -q dataflow/pipeline/Pipeline.py dataflow/utils/storage.py dataflow/utils/stream_transaction.py test/cpu_only/test_stream_transactional_resume.py
